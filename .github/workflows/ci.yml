name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (${{ matrix.buildtype }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        buildtype: [debug, release]

    steps:
      - uses: actions/checkout@v4
        with:
          # version.ps1 derives the build revision from the commit count, so
          # a shallow clone would produce a wrong version number.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Meson and Ninja
        run: python -m pip install --upgrade meson ninja

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The wrap downloads dominate a cold build, so cache them separately
      # from the compiled output.
      - name: Cache subproject downloads
        uses: actions/cache@v4
        with:
          path: subprojects/packagecache
          key: packagecache-${{ runner.os }}-${{ hashFiles('subprojects/*.wrap') }}
          restore-keys: packagecache-${{ runner.os }}-

      - name: Configure
        run: >
          meson setup build-win
          --buildtype=${{ matrix.buildtype }}
          --default-library=static

      - name: Build
        run: meson compile -C build-win

      - name: Test
        run: meson test -C build-win --print-errorlogs

      - name: Upload configure and test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meson-logs-${{ matrix.buildtype }}
          path: build-win/meson-logs/
          retention-days: 7

      - name: Upload build
        if: matrix.buildtype == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: aegisub-windows-x64
          path: |
            build-win/aegisub.exe
            automation/
          retention-days: 14
