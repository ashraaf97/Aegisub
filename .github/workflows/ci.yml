name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (${{ matrix.buildtype }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        buildtype: [debug, release]

    steps:
      - uses: actions/checkout@v7
        with:
          # version.ps1 derives the build revision from the commit count, so
          # a shallow clone would produce a wrong version number.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Meson and Ninja
        run: python -m pip install --upgrade meson ninja

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The wrap downloads dominate a cold build, so cache them separately
      # from the compiled output. Restore and save are split rather than using
      # actions/cache, whose save step is skipped when the job fails -- the
      # downloads are perfectly good even if the build afterwards is not, and
      # discarding them means the next run pays for a cold fetch again.
      #
      # Every wrap pins an exact tag or commit, so hashing the wrap files is a
      # sound cache key: it changes exactly when the fetched sources do.
      - name: Restore subproject downloads
        id: packagecache
        uses: actions/cache/restore@v6
        with:
          path: subprojects/packagecache
          key: packagecache-${{ runner.os }}-${{ hashFiles('subprojects/*.wrap') }}
          restore-keys: packagecache-${{ runner.os }}-

      - name: Configure
        run: >
          meson setup build-win
          --buildtype=${{ matrix.buildtype }}
          --default-library=static

      # The wraps are fetched during configure, so save here rather than at
      # the end of the job.
      - name: Save subproject downloads
        if: always() && steps.packagecache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: subprojects/packagecache
          key: packagecache-${{ runner.os }}-${{ hashFiles('subprojects/*.wrap') }}

      - name: Build
        run: meson compile -C build-win

      - name: Test
        run: meson test -C build-win --print-errorlogs

      - name: Upload configure and test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: meson-logs-${{ matrix.buildtype }}
          path: build-win/meson-logs/
          retention-days: 7

      - name: Upload build
        if: matrix.buildtype == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: aegisub-windows-x64
          path: |
            build-win/aegisub.exe
            automation/
          retention-days: 14
